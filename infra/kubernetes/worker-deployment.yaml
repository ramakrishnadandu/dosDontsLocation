apiVersion: apps/v1
kind: Deployment
metadata:
  name: locaguide-worker
  namespace: locaguide
  labels:
    app: locaguide-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: locaguide-worker
  template:
    metadata:
      labels:
        app: locaguide-worker
    spec:
      serviceAccountName: locaguide-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: locaguide/worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: locaguide-config
            - secretRef:
                name: locaguide-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: locaguide-worker-pdb
  namespace: locaguide
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: locaguide-worker
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: locaguide-worker-hpa
  namespace: locaguide
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: locaguide-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
