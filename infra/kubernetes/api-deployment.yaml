apiVersion: apps/v1
kind: Deployment
metadata:
  name: locaguide-api
  namespace: locaguide
  labels:
    app: locaguide-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: locaguide-api
  template:
    metadata:
      labels:
        app: locaguide-api
    spec:
      serviceAccountName: locaguide-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: locaguide/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: locaguide-config
            - secretRef:
                name: locaguide-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: locaguide-api
  namespace: locaguide
spec:
  selector:
    app: locaguide-api
  ports:
    - port: 80
      targetPort: 4000
      name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: locaguide-api-pdb
  namespace: locaguide
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: locaguide-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: locaguide-api-hpa
  namespace: locaguide
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: locaguide-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
