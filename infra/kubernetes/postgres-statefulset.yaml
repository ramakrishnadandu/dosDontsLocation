# Self-managed PostgreSQL for on-prem / restricted-network deployments
# (section 34) where no managed database service is available. On AWS/
# Azure/GCP, prefer RDS/Cloud SQL/Azure Database for PostgreSQL instead and
# just point DATABASE_URL at it - see docs/deployment.md.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: locaguide
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: locaguide
            - name: POSTGRES_DB
              value: locaguide
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: locaguide-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "locaguide"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: locaguide
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
