# Self-managed Redis for on-prem / restricted-network deployments
# (section 34). On AWS/Azure/GCP, prefer ElastiCache/Memorystore/Azure
# Cache for Redis instead - see docs/deployment.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: locaguide
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: locaguide
spec:
  selector:
    app: redis
  ports:
    - port: 6379
