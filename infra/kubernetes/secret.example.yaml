# EXAMPLE ONLY - never commit real secrets to Git (section 18/19/38).
# Populate real values via `kubectl create secret generic ...`, a sealed
# secret controller, or your cloud provider's secret manager, then apply.
apiVersion: v1
kind: Secret
metadata:
  name: locaguide-secrets
  namespace: locaguide
type: Opaque
stringData:
  DATABASE_URL: "postgresql://locaguide:CHANGE_ME@postgres:5432/locaguide"
  REDIS_URL: "redis://redis:6379"
  JWT_SECRET: "CHANGE_ME_TO_A_LONG_RANDOM_VALUE"
  GOOGLE_MAPS_API_KEY: ""
  GOOGLE_PLACES_API_KEY: ""
  AMAZON_API_KEY: ""
  AMAZON_API_SECRET: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
