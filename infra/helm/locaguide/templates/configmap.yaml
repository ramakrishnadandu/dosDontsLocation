apiVersion: v1
kind: ConfigMap
metadata:
  name: locaguide-config
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  PORT: "4000"
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  AI_CONFIG_PATH: "./config/ai.yaml"
  POLICY_CONFIG_PATH: "./config/policies.yaml"
