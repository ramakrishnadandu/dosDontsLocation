apiVersion: apps/v1
kind: Deployment
metadata:
  name: locaguide-worker
  labels: { app: locaguide-worker }
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels: { app: locaguide-worker }
  template:
    metadata:
      labels: { app: locaguide-worker }
    spec:
      serviceAccountName: locaguide-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: "{{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}"
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          envFrom:
            - configMapRef: { name: locaguide-config }
            - secretRef: { name: {{ .Values.secretName }} }
          env:
            - name: DATABASE_URL
              value: {{ include "locaguide.databaseUrl" . | quote }}
            - name: REDIS_URL
              value: {{ include "locaguide.redisUrl" . | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{ toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: locaguide-worker-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: locaguide-worker }
{{- if .Values.worker.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: locaguide-worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: locaguide-worker
  minReplicas: {{ .Values.worker.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.worker.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.worker.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
